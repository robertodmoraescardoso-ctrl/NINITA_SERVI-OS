<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Villa Ninita — Acompanhamento de Serviços</title>
<link rel="icon" href="assets/img/icone.png">
<!-- versão fixada: atualizar só de propósito, depois de testar -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/estilo.css">
</head>
<body>

<header class="carimbo">
  <div class="carimbo__id">
    <img class="carimbo__logo" src="assets/img/logo.png" alt="Villa Ninita — Poço da Panela">
    <div>
      <h1>Acompanhamento de serviços</h1>
      <div class="obra"><input id="nomeObra" placeholder="trecho / torre em foco" maxlength="46"></div>
    </div>
  </div>

  <nav class="abas" role="tablist">
    <button class="aba" id="tabPainel" role="tab" aria-selected="true" data-aba="painel">
      Painel <span class="conta" id="contaPainel">0</span>
    </button>
    <button class="aba" id="tabAcomp" role="tab" aria-selected="false" data-aba="acompanhamento">
      Acompanhamento <span class="conta" id="contaAcomp">0</span>
    </button>
    <button class="aba" id="tabPlano" role="tab" aria-selected="false" data-aba="planejamento">
      Planejamento <span class="conta" id="contaPlano">0</span>
    </button>
  </nav>

  <div class="carimbo__acoes">
    <div class="usuario"><span id="usuarioAtivo"></span>
      <button class="btn btn--claro btn--p" id="btnSair">Sair</button></div>
    <button class="btn btn--claro btn--p" id="btnLocais">Locais</button>
    <button class="btn btn--claro btn--p" id="btnDados">Dados</button>
    <button class="btn btn--marca" id="btnIrPlano">+ Nova tarefa</button>
  </div>
</header>

<main>
  <!-- ========================= PAINEL ========================= -->
  <section class="tela" id="painel" role="tabpanel" aria-labelledby="tabPainel">
    <div id="avisoArmazenamento" class="aviso oculto"></div>


    <div class="indicadores">
      <div class="ind"><span class="ind__n" id="kpiTotal">0</span><span class="ind__r">Serviços</span></div>
      <div class="ind ind--andamento"><span class="ind__n" id="kpiAndamento">0</span><span class="ind__r">Em andamento</span></div>
      <div class="ind"><span class="ind__n" id="kpiPlanejado">0</span><span class="ind__r">Planejados</span></div>
      <div class="ind ind--concluido"><span class="ind__n" id="kpiConcluido">0</span><span class="ind__r">Concluídos</span></div>
      <div class="ind ind--atrasado"><span class="ind__n" id="kpiAtrasado">0</span><span class="ind__r">Em atraso</span></div>
      <div class="ind"><span class="ind__n" id="kpiFotos">0</span><span class="ind__r">Fotos no acervo</span></div>
    </div>

    <div class="filtro-local" id="filtroLocal"></div>

    <div class="barra">
      <div class="campo-busca">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="busca" placeholder="Buscar por título, local, colaborador ou código">
      </div>
      <select id="filtroStatus">
        <option value="aberto" selected>Em aberto (não concluídos)</option>
        <option value="">Todos os status</option>
        <option value="planejado">Planejado</option>
        <option value="andamento">Em andamento</option>
        <option value="concluido">Concluído</option>
        <option value="paralisado">Paralisado</option>
      </select>
      <select id="filtroTitulo"><option value="">Todos os serviços</option></select>
      <select id="filtroResp"><option value="">Todos os responsáveis</option></select>
      <select id="ordenacao">
        <option value="inicio">Ordenar por início</option>
        <option value="fim">Ordenar por término</option>
        <option value="duracao">Ordenar por duração</option>
        <option value="titulo">Ordenar por título</option>
        <option value="atualizacao">Ordenar por última atualização</option>
      </select>
      <div class="sep"></div>
      <div class="alternador">
        <button id="visaoQuadro" aria-pressed="true">Quadro</button>
        <button id="visaoTempo" aria-pressed="false">Linha do tempo</button>
      </div>
      <button class="btn btn--p" id="btnImprimir">Imprimir</button>
    </div>

    <div id="resumoQuant"></div>

    <div class="quadro" id="quadro"></div>
    <div class="gantt oculto" id="linhaTempo"></div>
  </section>

  <!-- ==================== ACOMPANHAMENTO ==================== -->
  <section class="tela oculto" id="acompanhamento" role="tabpanel" aria-labelledby="tabAcomp">
    <div class="painel-duplo">
      <aside class="lista">
        <div class="lista__cab">
          <span class="rotulo">Serviços</span>
          <select id="filtroLista" class="btn btn--p" style="padding:4px 6px">
            <option value="abertos">Em aberto</option>
            <option value="andamento">Só em andamento</option>
            <option value="todos">Todos</option>
          </select>
        </div>
        <div class="lista__itens" id="listaServicos"></div>
      </aside>

      <div id="detalhe"></div>
    </div>
  </section>

  <!-- ======================= PLANEJAMENTO ======================= -->
  <section class="tela oculto" id="planejamento" role="tabpanel" aria-labelledby="tabPlano">
    <div class="indicadores" id="indPlano"></div>

    <div class="barra">
      <div class="campo-busca">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input type="text" id="buscaPlano" placeholder="Buscar tarefa planejada">
      </div>
      <select id="filtroDiscPlano"><option value="">Todas as disciplinas</option></select>
      <div class="sep"></div>
      <button class="btn btn--marca" id="btnNovaTarefa">+ Nova tarefa planejada</button>
    </div>

    <div id="tabelaPlano"></div>
  </section>
</main>

<div id="modais"></div>
<div class="toast" id="toast"></div>

<script type="module" src="assets/js/main.js"></script>
<script>
/* Segurança de publicação: se a pasta assets/ ou o config.js não
   foram enviados junto com o index.html, os módulos não carregam e a
   tela ficaria em branco. Aqui o problema vira uma mensagem legível. */
window.addEventListener("load", function(){
  if(window.vnCarregado) return;
  var a = document.getElementById("avisoArmazenamento");
  document.body.classList.remove("bloqueado");
  if(a){
    a.classList.remove("oculto");
    a.innerHTML = "<strong>Atenção.</strong> Os arquivos do sistema não carregaram. " +
      "Confira se a pasta assets e o arquivo config.js foram publicados junto com o index.html, " +
      "e se a página está sendo aberta por um endereço http (Live Server, GitHub Pages ou Netlify), " +
      "e não com dois cliques no arquivo.";
  }
});
</script>
</body>
</html>
