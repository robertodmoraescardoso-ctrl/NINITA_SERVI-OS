<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  /* paleta tirada do próprio empreendimento:
     verde-eucalipto da marca, ripado de madeira da fachada,
     concreto claro dos brises e folhagem do paisagismo */
  --papel:#EDEAE2;
  --papel-2:#FCFAF6;
  --papel-3:#F4F1E9;
  --tinta:#2E3128;
  --tinta-2:#6B6F5D;
  --tinta-3:#9C9F8C;
  --linha:#D7D4C6;
  --linha-forte:#B3B1A0;

  --marca:#DBDBCC;          /* verde-eucalipto da logo */
  --marca-escura:#5F6551;
  --madeira:#8E5A36;        /* ripado da fachada */
  --madeira-clara:#F3E6D9;
  --folha:#4F6B3A;          /* paisagismo */
  --folha-clara:#E6EDDF;
  --tijolo:#A0473A;
  --tijolo-claro:#F7E4E0;
  --pedra:#8A8D79;
  --pedra-clara:#E5E5DA;
  --ambar:#C08155;          /* madeira clara: serviço em curso */

  --disp:'Jost','Century Gothic','Futura',sans-serif;
  --corpo:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;

  --r:4px;
  --sombra:0 1px 2px rgba(46,49,40,.09), 0 8px 22px rgba(46,49,40,.07);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--papel);
  background-image:
    linear-gradient(rgba(95,101,81,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(95,101,81,.05) 1px, transparent 1px);
  background-size:28px 28px;
  color:var(--tinta);
  font-family:var(--corpo);
  font-size:15px;
  line-height:1.45;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--disp);font-weight:600;letter-spacing:.01em}
a{color:var(--madeira)}

.oculto{display:none !important}
.mono{font-family:var(--mono)}

/* rótulo de anotação de prancha */
.rotulo{
  font-family:var(--disp);
  font-size:11px;
  font-weight:500;
  letter-spacing:.2em;
  text-transform:uppercase;
  color:var(--tinta-2);
}

/* ============================================================
   CARIMBO (cabeçalho)
   ============================================================ */
.carimbo{
  position:sticky;top:0;z-index:60;
  display:flex;align-items:stretch;gap:0;
  background:var(--tinta);
  color:#fff;
  border-bottom:3px solid var(--marca);
}
.carimbo__id{
  display:flex;align-items:center;gap:16px;
  padding:9px 20px 9px 18px;
  border-right:1px solid rgba(255,255,255,.16);
}
.carimbo__logo{height:34px;width:auto;display:block;flex:none}
.carimbo__id h1{
  font-size:12px;font-weight:400;line-height:1.1;
  text-transform:uppercase;letter-spacing:.24em;color:rgba(255,255,255,.72);
}
.carimbo__id .obra{
  font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.55);
  letter-spacing:.04em;
}
.carimbo__id .obra input{
  background:transparent;border:0;border-bottom:1px dashed rgba(255,255,255,.3);
  color:rgba(255,255,255,.85);font-family:var(--mono);font-size:11px;
  padding:1px 2px;width:190px;
}
.carimbo__id .obra input:focus{outline:none;border-bottom-color:var(--marca)}

.abas{display:flex;align-items:stretch;flex:1}
.aba{
  background:transparent;border:0;border-right:1px solid rgba(255,255,255,.12);
  color:rgba(255,255,255,.62);
  font-family:var(--disp);font-size:12.5px;font-weight:500;
  letter-spacing:.2em;text-transform:uppercase;
  padding:0 20px;cursor:pointer;position:relative;
}
.aba:hover{color:#fff;background:rgba(255,255,255,.05)}
.aba[aria-selected="true"]{color:var(--tinta);background:var(--marca)}
.aba .conta{
  font-family:var(--mono);font-size:11px;letter-spacing:0;
  background:rgba(255,255,255,.15);padding:1px 5px;border-radius:2px;margin-left:7px;
}
.aba[aria-selected="true"] .conta{background:rgba(0,0,0,.18)}

.carimbo__acoes{display:flex;align-items:center;gap:8px;padding:0 14px}

/* ============================================================
   BOTÕES
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  border:1px solid var(--linha-forte);background:var(--papel-2);color:var(--tinta);
  padding:7px 13px;border-radius:var(--r);cursor:pointer;
  font-size:13px;font-weight:500;white-space:nowrap;
  transition:background .12s, border-color .12s, transform .06s;
}
.btn:hover{background:var(--papel-3);border-color:var(--tinta-2)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible{outline:2px solid var(--madeira);outline-offset:2px}
.btn--marca{background:var(--marca);border-color:#BFC0AD;color:var(--tinta);font-weight:600}
.btn--marca:hover{background:#E6E6D9;border-color:#A9AB96}
.btn--madeira{background:var(--madeira);border-color:var(--madeira);color:#fff}
.btn--madeira:hover{background:#2A5F8F;border-color:#2A5F8F}
.btn--fantasma{background:transparent;border-color:transparent;color:var(--tinta-2)}
.btn--fantasma:hover{background:rgba(0,0,0,.05);color:var(--tinta)}
.btn--perigo{color:var(--tijolo);border-color:#E3B7B1}
.btn--perigo:hover{background:var(--tijolo-claro)}
.btn--p{padding:4px 9px;font-size:12px}
.btn--claro{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
.btn--claro:hover{background:rgba(255,255,255,.2)}

/* ============================================================
   LAYOUT
   ============================================================ */
.tela{padding:20px 22px 60px;max-width:1560px;margin:0 auto}

/* ---- faixa do empreendimento ---- */
.faixa-obra{
  position:relative;border-radius:var(--r);overflow:hidden;
  border:1px solid var(--linha-forte);margin-bottom:16px;
  background:var(--tinta);
}
.faixa-obra img{
  width:100%;height:186px;object-fit:cover;object-position:50% 58%;display:block;
}
.faixa-obra::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(100deg, rgba(46,49,40,.92) 0%, rgba(46,49,40,.72) 34%, rgba(46,49,40,.06) 66%);
}
.faixa-obra__txt{
  position:absolute;left:0;top:0;bottom:0;z-index:2;
  display:flex;flex-direction:column;justify-content:center;gap:7px;
  padding:0 26px;max-width:62%;
}
.faixa-obra__olho{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--marca);opacity:.85;
}
.faixa-obra h2{
  font-family:var(--disp);font-size:25px;font-weight:300;letter-spacing:.02em;
  color:#fff;line-height:1.15;
}
.faixa-obra__dados{display:flex;flex-wrap:wrap;gap:18px;margin-top:2px}
.faixa-obra__dado{border-left:2px solid var(--marca);padding-left:9px}
.faixa-obra__dado b{
  display:block;font-family:var(--mono);font-size:15px;font-weight:500;color:#fff;line-height:1.2;
}
.faixa-obra__dado span{
  font-family:var(--disp);font-size:9.5px;font-weight:500;letter-spacing:.19em;
  text-transform:uppercase;color:rgba(255,255,255,.6);
}
@media (max-width:700px){
  .faixa-obra img{height:210px;object-position:50% 55%}
  .faixa-obra::after{background:linear-gradient(180deg, rgba(46,49,40,.35) 0%, rgba(46,49,40,.93) 55%)}
  .faixa-obra__txt{max-width:100%;justify-content:flex-end;padding:0 16px 16px}
  .faixa-obra h2{font-size:20px}
}

/* ---- indicadores ---- */
.indicadores{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px;margin-bottom:16px;
}
.ind{
  background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--r);
  padding:11px 14px;position:relative;overflow:hidden;
}
.ind::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pedra)}
.ind--andamento::before{background:var(--ambar)}
.ind--concluido::before{background:var(--folha)}
.ind--atrasado::before{background:var(--tijolo)}
.ind__n{font-family:var(--mono);font-size:27px;font-weight:600;line-height:1.1;display:block}
.ind__r{font-family:var(--disp);font-size:10.5px;font-weight:500;letter-spacing:.19em;text-transform:uppercase;color:var(--tinta-2)}

/* ---- barra de filtros ---- */
.barra{
  display:flex;flex-wrap:wrap;align-items:center;gap:8px;
  background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--r);
  padding:9px 11px;margin-bottom:16px;
}
.campo-busca{position:relative;flex:1;min-width:180px}
.campo-busca input{
  width:100%;padding:7px 10px 7px 30px;border:1px solid var(--linha);
  border-radius:var(--r);background:var(--papel-3);
}
.campo-busca svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--tinta-3)}
select,input[type="text"],input[type="date"],input[type="number"],textarea{
  border:1px solid var(--linha);border-radius:var(--r);
  padding:7px 9px;background:var(--papel-2);
}
select:focus,input:focus,textarea:focus{outline:2px solid var(--madeira);outline-offset:-1px;border-color:var(--madeira)}
.sep{width:1px;align-self:stretch;background:var(--linha);margin:0 3px}

.alternador{display:flex;border:1px solid var(--linha);border-radius:var(--r);overflow:hidden}
.alternador button{
  border:0;background:var(--papel-2);padding:7px 14px;cursor:pointer;font-size:11.5px;
  font-family:var(--disp);letter-spacing:.16em;text-transform:uppercase;font-weight:500;
  color:var(--tinta-2);
}
.alternador button[aria-pressed="true"]{background:var(--tinta);color:#fff}

/* ============================================================
   QUADRO DE SERVIÇOS (cartões estilo carimbo de prancha)
   ============================================================ */
.quadro{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

.cartao{
  background:var(--papel-2);border:1px solid var(--linha-forte);border-radius:var(--r);
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:var(--sombra);transition:box-shadow .15s, transform .1s;
}
.cartao:hover{box-shadow:0 2px 4px rgba(21,24,27,.12), 0 12px 26px rgba(21,24,27,.10);transform:translateY(-1px)}

.cartao__topo{display:flex;align-items:flex-start;gap:10px;padding:11px 12px 9px;border-bottom:1px solid var(--linha)}
.cartao__faixa{width:5px;align-self:stretch;border-radius:2px;background:var(--pedra);flex:none}
.cartao__tit{flex:1;min-width:0}
.cartao__cod{font-family:var(--mono);font-size:11px;color:var(--tinta-3);letter-spacing:.06em;display:block}
.cartao__tit h3{font-size:17px;font-weight:500;letter-spacing:.005em;line-height:1.2;margin-top:2px;word-break:break-word}
.cartao__local{font-size:12px;color:var(--tinta-2);margin-top:2px}

.marca{
  font-family:var(--disp);font-size:10px;font-weight:500;letter-spacing:.17em;text-transform:uppercase;
  padding:3px 8px;border-radius:2px;white-space:nowrap;flex:none;
  background:var(--pedra-clara);color:var(--pedra);
}
.marca--andamento{background:var(--madeira-clara);color:var(--madeira)}
.marca--concluido{background:var(--folha-clara);color:var(--folha)}
.marca--paralisado{background:var(--tijolo-claro);color:var(--tijolo)}

/* tira de fotos */
.tira{display:flex;gap:2px;background:var(--tinta);min-height:78px}
.tira img{width:100%;height:78px;object-fit:cover;flex:1;min-width:0;cursor:zoom-in;display:block}
.tira__vazia{
  flex:1;display:flex;align-items:center;justify-content:center;height:78px;
  background:repeating-linear-gradient(45deg,#F1EFE7,#F1EFE7 8px,#E6E4D9 8px,#E6E4D9 16px);
  color:var(--tinta-3);font-size:10.5px;font-family:var(--disp);letter-spacing:.2em;text-transform:uppercase;
}
.tira__mais{
  position:relative;flex:none;width:52px;height:78px;background:var(--tinta);color:#fff;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;
}

/* progresso */
.prog{height:5px;background:var(--pedra-clara);position:relative}
.prog__b{height:100%;background:var(--madeira);transition:width .3s}

/* faixa de dados — o "carimbo" do cartão */
.dados{display:grid;grid-template-columns:1fr 1fr auto;border-top:1px solid var(--linha)}
.dados__c{padding:7px 10px;border-right:1px solid var(--linha);min-width:0}
.dados__c:last-child{border-right:0}
.dados__r{font-family:var(--disp);font-size:9.5px;font-weight:500;letter-spacing:.19em;text-transform:uppercase;color:var(--tinta-3);display:block}
.dados__v{font-family:var(--mono);font-size:13.5px;font-weight:500;white-space:nowrap}
.dados__v.pendente{color:var(--tinta-3)}

/* contador de dias — elemento de assinatura */
.contador{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:5px 12px;background:var(--marca);color:var(--tinta);min-width:66px;
}
.contador--fechado{background:var(--tinta);color:var(--marca)}
.contador--atrasado{background:var(--tijolo);color:#fff}
.contador__n{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1}
.contador__u{font-family:var(--disp);font-size:8.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;opacity:.85}

.cartao__pe{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 10px;border-top:1px solid var(--linha);background:var(--papel-3);
}
.equipe{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.pessoa{
  font-size:11.5px;background:var(--madeira-clara);color:var(--madeira);
  border:1px solid #E3CFBC;padding:1px 7px;border-radius:20px;white-space:nowrap;
}
.pessoa--vazio{background:transparent;border-color:var(--linha);color:var(--tinta-3)}
.cartao__pe .acoes{display:flex;gap:4px;flex:none}

.alerta-atraso{
  font-family:var(--mono);font-size:11px;color:var(--tijolo);font-weight:600;
  padding:5px 12px;background:var(--tijolo-claro);border-top:1px solid #EACFCA;
}

/* ============================================================
   LINHA DO TEMPO (gantt simplificado)
   ============================================================ */
.gantt{background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--r);overflow:auto}
.gantt table{border-collapse:collapse;width:100%;min-width:760px}
.gantt th,.gantt td{border-bottom:1px solid var(--linha);padding:0;vertical-align:middle}
.gantt thead th{
  position:sticky;top:0;background:var(--papel-3);z-index:2;
  font-family:var(--disp);font-size:10px;letter-spacing:.17em;text-transform:uppercase;
  color:var(--tinta-2);font-weight:500;padding:8px 10px;text-align:left;
  border-bottom:2px solid var(--linha-forte);
}
.gantt .col-nome{width:290px;min-width:290px;padding:8px 10px;border-right:1px solid var(--linha)}
.gantt .col-nome strong{display:block;font-weight:600;font-size:14px}
.gantt .col-nome span{font-family:var(--mono);font-size:11px;color:var(--tinta-3)}
.faixa-tempo{position:relative;height:38px;background-image:linear-gradient(90deg,var(--linha) 1px,transparent 1px);background-size:var(--passo,40px) 100%}
.barra-g{
  position:absolute;top:9px;height:20px;border-radius:3px;
  display:flex;align-items:center;padding:0 7px;overflow:hidden;
  font-family:var(--mono);font-size:11px;color:#fff;white-space:nowrap;
}
.barra-g--planejado{background:var(--pedra)}
.barra-g--andamento{background:var(--ambar);color:#fff}
.barra-g--concluido{background:var(--folha)}
.barra-g--paralisado{background:var(--tijolo)}
.hoje{position:absolute;top:0;bottom:0;width:2px;background:var(--tijolo);z-index:3;pointer-events:none}
.hoje::after{
  content:"HOJE";position:absolute;top:-1px;left:3px;font-family:var(--mono);font-size:9px;
  color:#fff;background:var(--tijolo);padding:0 3px;border-radius:0 2px 2px 0;
}
.gantt__cab-tempo{position:relative;height:100%}
.marca-mes{position:absolute;top:0;font-family:var(--mono);font-size:10px;color:var(--tinta-2);border-left:1px solid var(--linha-forte);padding-left:4px}

/* ============================================================
   TABELAS (planejamento e resumo quantitativo)
   ============================================================ */
.painel-tabela{
  background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--r);
  overflow:auto;box-shadow:var(--sombra);margin-bottom:16px;
}
.painel-tabela__cab{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 13px;border-bottom:2px solid var(--tinta);background:var(--papel-3);
}
.tabela{border-collapse:collapse;width:100%;font-size:13.5px}
.tabela th{
  font-family:var(--disp);font-size:10px;font-weight:500;letter-spacing:.17em;
  text-transform:uppercase;color:var(--tinta-2);text-align:left;
  padding:8px 11px;border-bottom:1px solid var(--linha-forte);
  background:var(--papel-3);white-space:nowrap;
}
.tabela td{padding:9px 11px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tabela tbody tr:hover{background:var(--papel-3)}
.tabela .num{font-family:var(--mono);white-space:nowrap;text-align:right}
.tabela .cod{font-family:var(--mono);font-size:11.5px;color:var(--tinta-3)}
.tabela .tit{font-weight:600}
.tabela .sub{font-size:11.5px;color:var(--tinta-2)}
.tabela .acoes{display:flex;gap:5px;justify-content:flex-end}
.tabela tfoot td{border-top:2px solid var(--tinta);border-bottom:0;font-weight:600;background:var(--papel-3)}
.linha-vencida{background:var(--tijolo-claro) !important}
.aviso-linha{font-family:var(--mono);font-size:10.5px;color:var(--tijolo);font-weight:600;display:block}
.barra-mini{position:relative;height:6px;background:var(--pedra-clara);border-radius:3px;overflow:hidden;min-width:70px}
.barra-mini i{position:absolute;left:0;top:0;bottom:0;background:var(--folha);display:block}
.barra-mini.parcial i{background:var(--ambar)}
.quant-cartao{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:6px 10px;border-top:1px solid var(--linha);background:var(--papel-3);
  font-family:var(--mono);font-size:12px;
}
.quant-cartao .pct{color:var(--tinta-2)}
@media (max-width:700px){
  .tabela{font-size:12.5px}
  .tabela th,.tabela td{padding:7px 8px}
  .esconde-mob{display:none}
}

/* ============================================================
   ABA ACOMPANHAMENTO
   ============================================================ */
.painel-duplo{display:grid;grid-template-columns:310px 1fr;gap:16px;align-items:start}

.lista{background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--r);overflow:hidden;position:sticky;top:80px}
.lista__cab{padding:9px 11px;border-bottom:1px solid var(--linha);background:var(--papel-3);display:flex;align-items:center;justify-content:space-between;gap:8px}
.lista__itens{max-height:calc(100vh - 210px);overflow:auto}
.item{
  display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--linha);
  background:transparent;padding:10px 11px;cursor:pointer;border-left:4px solid transparent;
}
.item:hover{background:var(--papel-3)}
.item[aria-current="true"]{background:var(--madeira-clara);border-left-color:var(--madeira)}
.item__cod{font-family:var(--mono);font-size:10.5px;color:var(--tinta-3)}
.item__tit{font-weight:600;font-size:14px;line-height:1.25;margin:1px 0 3px}
.item__meta{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--tinta-2)}
.ponto{width:7px;height:7px;border-radius:50%;background:var(--pedra);flex:none}
.ponto--andamento{background:var(--ambar)}
.ponto--concluido{background:var(--folha)}
.ponto--paralisado{background:var(--tijolo)}

.folha{background:var(--papel-2);border:1px solid var(--linha);border-radius:var(--r);box-shadow:var(--sombra)}
.folha__cab{padding:14px 16px;border-bottom:2px solid var(--tinta)}
.folha__cab h2{font-size:23px;font-weight:400;letter-spacing:.01em;line-height:1.15}
.folha__cab .cod{font-family:var(--mono);font-size:12px;color:var(--tinta-3);letter-spacing:.08em}
.folha__grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));border-bottom:1px solid var(--linha)}
.folha__grade .dados__c{border-bottom:0}

.bloco{padding:16px}
.bloco+.bloco{border-top:1px solid var(--linha)}
.bloco__tit{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}

/* formulário */
.form-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.campo{display:flex;flex-direction:column;gap:4px}
.campo label{font-family:var(--disp);font-size:10.5px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--tinta-2)}
.campo textarea{min-height:84px;resize:vertical;line-height:1.5}
.campo--largo{grid-column:1/-1}
.dica{font-size:11.5px;color:var(--tinta-3)}

/* chips de colaboradores */
.chips{
  display:flex;flex-wrap:wrap;gap:5px;align-items:center;
  border:1px solid var(--linha);border-radius:var(--r);padding:5px;background:var(--papel-2);min-height:38px;
}
.chips:focus-within{outline:2px solid var(--madeira);outline-offset:-1px;border-color:var(--madeira)}
.chips input{border:0;padding:4px;flex:1;min-width:110px;background:transparent}
.chips input:focus{outline:none}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--madeira-clara);color:var(--madeira);border:1px solid #E3CFBC;border-radius:20px;padding:2px 4px 2px 9px;font-size:12.5px}
.chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:15px;line-height:1;padding:0 3px;opacity:.6}
.chip button:hover{opacity:1}
.sugestoes{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.sugestao{border:1px dashed var(--linha-forte);background:transparent;border-radius:20px;padding:2px 9px;font-size:12px;cursor:pointer;color:var(--tinta-2)}
.sugestao:hover{border-style:solid;border-color:var(--madeira);color:var(--madeira)}

/* fotos no formulário */
.dropzone{
  border:2px dashed var(--linha-forte);border-radius:var(--r);padding:16px;text-align:center;
  background:var(--papel-3);cursor:pointer;
}
.dropzone:hover,.dropzone.sobre{border-color:var(--madeira);background:var(--madeira-clara)}
.dropzone strong{display:block;font-family:var(--disp);font-size:13.5px;font-weight:500;letter-spacing:.16em;text-transform:uppercase}
.miniaturas{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.mini{position:relative;width:96px;height:72px;border:1px solid var(--linha-forte);border-radius:3px;overflow:hidden;background:var(--tinta)}
.mini img{width:100%;height:100%;object-fit:cover;display:block}
.mini button{
  position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;
  background:rgba(21,24,27,.75);color:#fff;cursor:pointer;font-size:13px;line-height:1;
}
.mini button:hover{background:var(--tijolo)}

/* histórico de apontamentos */
.historico{list-style:none;margin:0;padding:0;position:relative}
.historico::before{content:"";position:absolute;left:8px;top:6px;bottom:6px;width:2px;background:var(--linha)}
.apont{position:relative;padding:0 0 18px 30px}
.apont::before{
  content:"";position:absolute;left:2px;top:5px;width:14px;height:14px;border-radius:50%;
  background:var(--papel-2);border:3px solid var(--madeira);
}
.apont__cab{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:5px}
.apont__data{font-family:var(--mono);font-size:13px;font-weight:600}
.apont__obs{white-space:pre-wrap;background:var(--papel-3);border-left:3px solid var(--linha-forte);padding:8px 11px;border-radius:0 var(--r) var(--r) 0;margin:6px 0}
.etiqueta{font-family:var(--mono);font-size:11px;background:var(--pedra-clara);color:var(--tinta-2);padding:1px 7px;border-radius:3px}
.etiqueta--avanco{background:var(--madeira-clara);color:var(--madeira);font-weight:600}

/* vazio */
.vazio{text-align:center;padding:56px 20px;color:var(--tinta-2)}
.vazio h3{font-size:19px;font-weight:400;margin-bottom:6px;color:var(--tinta)}
.vazio p{margin:0 0 16px;font-size:14px}

/* ============================================================
   MODAL
   ============================================================ */
.cortina{
  position:fixed;inset:0;background:rgba(21,24,27,.62);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:26px 16px;overflow:auto;
}
.modal{
  background:var(--papel-2);border-radius:var(--r);width:100%;max-width:760px;
  box-shadow:0 24px 60px rgba(46,49,40,.35);border-top:4px solid var(--marca);
}
.modal__cab{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--linha)}
.modal__cab h2{font-size:17px;font-weight:500;text-transform:uppercase;letter-spacing:.16em}
.modal__corpo{padding:18px}
.modal__pe{display:flex;justify-content:flex-end;gap:8px;padding:13px 18px;border-top:1px solid var(--linha);background:var(--papel-3)}
.fechar{border:0;background:transparent;font-size:24px;line-height:1;cursor:pointer;color:var(--tinta-2);padding:2px 8px}
.fechar:hover{color:var(--tijolo)}

/* lightbox */
.lightbox{position:fixed;inset:0;background:rgba(24,26,20,.95);z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.lightbox img{max-width:94vw;max-height:80vh;object-fit:contain;border:1px solid rgba(255,255,255,.15)}
.lightbox__barra{display:flex;align-items:center;gap:14px;color:#fff;font-family:var(--mono);font-size:13px}

/* portão: configuração e login */
.bloqueado .carimbo,.bloqueado main{display:none}
.portao{align-items:center;background:rgba(46,49,40,.97)}
.portao__caixa{
  width:100%;max-width:380px;background:var(--tinta);
  border:1px solid rgba(219,219,204,.2);border-top:4px solid var(--marca);
  border-radius:var(--r);padding:26px 24px 24px;text-align:center;
  box-shadow:0 28px 70px rgba(0,0,0,.5);
}
.portao__logo{height:38px;width:auto;margin-bottom:14px}
.portao__caixa h2{
  font-family:var(--disp);font-size:15px;font-weight:400;letter-spacing:.2em;
  text-transform:uppercase;color:#fff;margin-bottom:8px;
}
.portao__ajuda{font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.55);margin:0 0 18px}
.portao__erro{
  background:rgba(160,71,58,.22);border:1px solid rgba(160,71,58,.55);
  color:#F0C4BD;border-radius:var(--r);padding:9px 11px;font-size:12.5px;
  margin-bottom:14px;text-align:left;line-height:1.45;
}
.portao__r{
  display:block;text-align:left;font-family:var(--disp);font-size:10px;font-weight:500;
  letter-spacing:.19em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-bottom:4px;
}
.portao__campo{
  width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);
  color:#fff;border-radius:var(--r);padding:9px 11px;margin-bottom:13px;font-size:14px;
}
.portao__campo:focus{outline:2px solid var(--marca);outline-offset:-1px;border-color:var(--marca)}
.portao__btn{width:100%;justify-content:center;margin-top:4px;padding:10px}
.portao__link{
  display:block;width:100%;margin-top:12px;background:transparent;border:0;cursor:pointer;
  color:rgba(255,255,255,.45);font-size:12px;text-decoration:underline;
}
.portao__link:hover{color:var(--marca)}

/* identificação do usuário no cabeçalho */
.usuario{
  display:flex;align-items:center;gap:7px;color:rgba(255,255,255,.55);
  font-family:var(--mono);font-size:11px;max-width:190px;
}
.usuario span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:700px){.usuario{display:none}}

/* aviso de armazenamento */
.aviso{
  background:var(--madeira-clara);border:1px solid #E0C4A8;border-left:4px solid var(--madeira);
  border-radius:var(--r);padding:10px 13px;margin-bottom:14px;font-size:13px;color:#6B4224;
}

/* toast */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);
  background:var(--tinta);color:#fff;padding:11px 18px;border-radius:var(--r);
  font-size:14px;z-index:300;box-shadow:0 10px 30px rgba(46,49,40,.35);
  border-left:4px solid var(--marca);opacity:0;transition:transform .25s, opacity .25s;
}
.toast.ver{transform:translateX(-50%) translateY(0);opacity:1}

/* ============================================================
   RESPONSIVO
   ============================================================ */
@media (max-width:960px){
  .painel-duplo{grid-template-columns:1fr}
  .lista{position:static}
  .lista__itens{max-height:270px}
}
@media (max-width:700px){
  .carimbo{flex-wrap:wrap}
  .carimbo__id{width:100%;border-right:0;border-bottom:1px solid rgba(255,255,255,.16)}
  .abas{flex:1 1 100%;order:3;border-top:1px solid rgba(255,255,255,.12)}
  .aba{flex:1;padding:0 10px;font-size:14px;height:44px}
  .carimbo__acoes{padding:8px 12px;width:100%;order:2}
  .carimbo__acoes .btn{flex:1;justify-content:center}
  .tela{padding:14px 12px 50px}
  .quadro{grid-template-columns:1fr}
}

@media (prefers-reduced-motion:reduce){
  *{transition:none !important;animation:none !important}
}

/* ============================================================
   IMPRESSÃO
   ============================================================ */
@media print{
  body{background:#fff}
  .carimbo,.barra,.cartao__pe .acoes,.modal__pe,.aviso{display:none !important}
  .faixa-obra{break-inside:avoid;margin-bottom:12px}
  .faixa-obra img{height:120px}
  .tela{padding:0;max-width:none}
  .quadro{grid-template-columns:1fr 1fr;gap:8px}
  .cartao{break-inside:avoid;box-shadow:none;border-color:#999}
  .tira img{height:60px}
  .apont{break-inside:avoid}
}

<script>
/* ============================================================
   GESTÃO DE SERVIÇOS DE OBRA
   Aplicação local. Os dados ficam no navegador da máquina.
   ============================================================ */
(function(){
"use strict";

/* ------------------------------------------------------------
   1. ARMAZENAMENTO — Supabase (nuvem)
   Os dados deixam de morar no aparelho e passam a morar no
   projeto Supabase. Qualquer celular ou computador com internet
   e a senha enxerga exatamente o mesmo painel.
   ------------------------------------------------------------ */

/* Cole aqui os dois valores do seu projeto Supabase.
   Se deixar como está, a ferramenta pede na primeira abertura
   e guarda no aparelho — mas preencher aqui é melhor, porque
   aí funciona direto em qualquer aparelho novo. */
const SUPABASE_URL   = "https://mouphzazqsikbeibgqyh.supabase.co";
/* Publishable key (sb_publishable_...). Projetos antigos podem
   usar a chave anon legada, que começa com eyJ. As duas servem.
   A chave secret (sb_secret_...) NUNCA entra aqui. */
const SUPABASE_CHAVE = "sb_publishable_gmsv9MVlXotqi4Z1cdam4Q_SqQJkNVW";

const BUCKET = "fotos";
let sb = null;
let usuario = null;

function cfgLocal(nome, padrao){
  try { return localStorage.getItem("vn_" + nome) || padrao; } catch(e){ return padrao; }
}
function guardarCfgLocal(nome, valor){
  try { localStorage.setItem("vn_" + nome, valor); } catch(e){}
}

let URL_SB   = cfgLocal("url", SUPABASE_URL);
let CHAVE_SB = cfgLocal("chave", SUPABASE_CHAVE);

function chaveValida(k){
  const t = String(k || "").trim();
  if(/^sb_secret_/.test(t)) return false;          /* chave errada: essa é de servidor */
  return /^sb_publishable_.{20,}$/.test(t) ||      /* formato novo */
         (/^eyJ/.test(t) && t.length > 40);        /* anon legada */
}

function configurado(){
  return /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/i.test(String(URL_SB).trim()) &&
         chaveValida(CHAVE_SB);
}

function conectar(){
  sb = window.supabase.createClient(String(URL_SB).trim(), String(CHAVE_SB).trim(), {
    auth: { persistSession: true, autoRefreshToken: true }
  });
}

/* --- as quatro funções abaixo mantêm a mesma assinatura da
       versão local, então o resto da aplicação não muda --- */

async function salvar(loja, obj){
  if(loja === "servicos"){
    const r = await sb.from("servicos").upsert({
      id: obj.id, dados: obj, atualizado_em: new Date().toISOString()
    });
    if(r.error) throw r.error;
    return;
  }
  if(loja === "config"){
    const r = await sb.from("config").upsert({ chave: obj.chave, valor: obj.valor });
    if(r.error) throw r.error;
    return;
  }
  if(loja === "fotos"){
    const r = await sb.storage.from(BUCKET).upload(obj.id + ".jpg", obj.blob, {
      contentType: (obj.blob && obj.blob.type) || "image/jpeg", upsert: true
    });
    if(r.error) throw r.error;
    return;
  }
}

async function apagar(loja, chave){
  if(loja === "servicos"){
    const r = await sb.from("servicos").delete().eq("id", chave);
    if(r.error) throw r.error;
    return;
  }
  if(loja === "config"){
    const r = await sb.from("config").delete().eq("chave", chave);
    if(r.error) throw r.error;
    return;
  }
  if(loja === "fotos"){
    const r = await sb.storage.from(BUCKET).remove([chave + ".jpg"]);
    if(r.error) throw r.error;
    return;
  }
}

/* ids de todas as fotos referenciadas hoje, sem baixar nada */
function idsFotosAtuais(){
  const out = [];
  estado.servicos.forEach(function(s){
    fotosDo(s).forEach(function(f){ if(out.indexOf(f) === -1) out.push(f); });
  });
  return out;
}

async function lerTudo(loja){
  if(loja === "servicos"){
    const r = await sb.from("servicos").select("dados").order("atualizado_em", {ascending:false});
    if(r.error) throw r.error;
    return (r.data || []).map(function(l){ return l.dados; }).filter(Boolean);
  }
  if(loja === "fotos"){
    /* usado apenas pelo backup: aqui sim precisa baixar os arquivos */
    const out = [];
    for(const f of idsFotosAtuais()){
      const r = await sb.storage.from(BUCKET).download(f + ".jpg");
      if(r.data) out.push({ id:f, blob:r.data, nome:f + ".jpg" });
    }
    return out;
  }
  return [];
}

async function ler(loja, chave){
  if(loja === "config"){
    const r = await sb.from("config").select("valor").eq("chave", chave).maybeSingle();
    if(r.error) return null;
    return r.data ? { chave: chave, valor: r.data.valor } : null;
  }
  if(loja === "fotos"){
    const r = await sb.storage.from(BUCKET).download(chave + ".jpg");
    return r.data ? { id: chave, blob: r.data } : null;
  }
  return null;
}

/* mensagem de erro em português, para não mostrar jargão de API */
function explicarErro(e){
  const t = String((e && (e.message || e.error_description)) || e || "");
  if(/Failed to fetch|NetworkError|Load failed/i.test(t))
    return "Sem conexão com a internet. O lançamento não foi gravado — mantenha esta tela aberta e tente de novo.";
  if(/Invalid login credentials/i.test(t)) return "E-mail ou senha incorretos.";
  if(/Email not confirmed/i.test(t)) return "Este usuário ainda não foi confirmado no Supabase.";
  if(/JWT|expired|not authenticated/i.test(t)) return "Sua sessão expirou. Entre novamente.";
  if(/row-level security|permission|policy/i.test(t))
    return "O banco recusou a operação. Rode de novo o script de configuração no Supabase.";
  if(/relation .* does not exist|schema cache/i.test(t))
    return "As tabelas ainda não existem no Supabase. Rode o script de configuração.";
  if(/Bucket not found/i.test(t))
    return "O depósito de fotos não existe no Supabase. Rode o script de configuração.";
  return t || "Não foi possível concluir a operação.";
}

const $  = function(s, ctx){ return (ctx||document).querySelector(s); };
const $$ = function(s, ctx){ return Array.prototype.slice.call((ctx||document).querySelectorAll(s)); };

function id(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function esc(t){
  return String(t == null ? "" : t)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}

/* --- datas: sempre tratadas como data de calendário local --- */
function dataLocal(iso){
  if(!iso) return null;
  const p = String(iso).slice(0,10).split("-");
  if(p.length !== 3) return null;
  const d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
  return isNaN(d.getTime()) ? null : d;
}
function paraISO(d){
  const m = String(d.getMonth()+1).padStart(2,"0");
  const dia = String(d.getDate()).padStart(2,"0");
  return d.getFullYear() + "-" + m + "-" + dia;
}
function hojeISO(){ return paraISO(new Date()); }
function fmt(iso){
  const d = dataLocal(iso);
  if(!d) return "—";
  return String(d.getDate()).padStart(2,"0") + "/" +
         String(d.getMonth()+1).padStart(2,"0") + "/" +
         String(d.getFullYear()).slice(2);
}
function fmtLongo(iso){
  const d = dataLocal(iso);
  if(!d) return "—";
  return String(d.getDate()).padStart(2,"0") + "/" +
         String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
}
/* diferença em dias de calendário, imune a horário de verão */
function difDias(isoA, isoB){
  const a = dataLocal(isoA), b = dataLocal(isoB);
  if(!a || !b) return null;
  return Math.round((b.getTime() - a.getTime()) / 86400000);
}
/* duração inclusiva: início e fim contam como dias trabalhados */
function diasCorridos(ini, fim){
  const d = difDias(ini, fim);
  return d === null ? null : d + 1;
}
/* Calendário da obra: segunda a sexta, descontando feriados.
   Nacionais + estadual de PE (06/03) + municipais do Recife.
   As segundas de carnaval entram porque a obra costuma emendar.
   Confira contra o calendário do cronograma e ajuste à vontade. */
const FERIADOS = [
  "2026-01-01","2026-02-16","2026-02-17","2026-03-06","2026-04-03","2026-04-21",
  "2026-05-01","2026-06-04","2026-06-24","2026-07-16","2026-09-07","2026-10-12",
  "2026-11-02","2026-11-15","2026-12-25",
  "2027-01-01","2027-02-08","2027-02-09","2027-03-06","2027-03-26","2027-04-21",
  "2027-05-01","2027-05-27","2027-06-24","2027-07-16","2027-09-07","2027-10-12",
  "2027-11-02","2027-11-15","2027-12-25"
];
const SET_FERIADOS = new Set(FERIADOS);

function ehFeriado(iso){ return SET_FERIADOS.has(iso); }

function diasUteis(ini, fim){
  const a = dataLocal(ini), b = dataLocal(fim);
  if(!a || !b || b < a) return null;
  let n = 0;
  const c = new Date(a.getTime());
  while(c <= b){
    const s = c.getDay();
    if(s !== 0 && s !== 6 && !ehFeriado(paraISO(c))) n++;
    c.setDate(c.getDate() + 1);
  }
  return n;
}

function feriadosNoPeriodo(ini, fim){
  const a = dataLocal(ini), b = dataLocal(fim);
  if(!a || !b || b < a) return [];
  const out = [];
  const c = new Date(a.getTime());
  while(c <= b){
    const s = c.getDay();
    if(s !== 0 && s !== 6 && ehFeriado(paraISO(c))) out.push(paraISO(c));
    c.setDate(c.getDate() + 1);
  }
  return out;
}

const STATUS = {

  andamento:  { rot:"Em andamento", cor:"var(--marca)"  },
  concluido:  { rot:"Concluído",    cor:"var(--folha)"     },
  paralisado: { rot:"Paralisado",   cor:"var(--tijolo)" }
};

/* data em que a contagem de dias para: fim real, ou hoje */
function dataReferencia(s){
  if(s.status === "concluido" && s.fimReal) return s.fimReal;
  if(s.status === "concluido" && s.fimPrev) return s.fimPrev;
  return hojeISO();
}

function duracao(s){
  if(!s.inicio) return null;
  const ref = dataReferencia(s);
  if(dataLocal(ref) < dataLocal(s.inicio)) return 0;
  return diasCorridos(s.inicio, ref);
}

function diasAtraso(s){
  if(s.status === "concluido"){
    if(s.fimPrev && s.fimReal){
      const d = difDias(s.fimPrev, s.fimReal);
      return d > 0 ? d : 0;
    }
    return 0;
  }
  if(!s.fimPrev) return 0;
  const d = difDias(s.fimPrev, hojeISO());
  return d > 0 ? d : 0;
}

function estaAtrasado(s){ return diasAtraso(s) > 0; }

/* ---- quantitativo ----
   O previsto fica no cadastro do serviço; o executado é a soma
   do que foi lançado em cada apontamento. */
const UNIDADES = ["m²","m³","m","un","pç","kg","t","L","vb"];

function quantPrevista(s){ return Number(s.quantidade) || 0; }

function quantExecutada(s){
  return (s.apontamentos || []).reduce(function(n,a){ return n + (Number(a.quantidade) || 0); }, 0);
}

function avancoFisico(s){
  const p = quantPrevista(s);
  if(!p) return null;
  return Math.min(100, Math.round((quantExecutada(s) / p) * 100));
}

/* formata sem casas inúteis: 320 em vez de 320,00 */
function num(v){
  const n = Number(v) || 0;
  return n.toLocaleString("pt-BR", {maximumFractionDigits:2});
}

function textoQuant(s){
  if(!quantPrevista(s)) return "";
  return num(quantExecutada(s)) + " / " + num(quantPrevista(s)) + " " + (s.unidade || "");
}

/* todas as fotos do serviço, do cadastro e dos apontamentos */
function fotosDo(s){
  let out = (s.fotos || []).slice();
  (s.apontamentos || []).forEach(function(a){ out = out.concat(a.fotos || []); });
  return out;
}

function pessoasDo(s){
  const set = new Set();
  if(s.responsavel) set.add(s.responsavel);
  (s.equipe || []).forEach(function(p){ set.add(p); });
  (s.apontamentos || []).forEach(function(a){
    (a.colaboradores || []).forEach(function(p){ set.add(p); });
  });
  return Array.from(set);
}

function ultimaAtualizacao(s){
  const aps = s.apontamentos || [];
  if(!aps.length) return s.criadoEm || "";
  return aps.map(function(a){ return a.data || ""; }).sort().pop();
}

function proximoCodigo(){
  let maior = 0;
  estado.servicos.forEach(function(s){
    const m = /(\d+)$/.exec(s.codigo || "");
    if(m) maior = Math.max(maior, Number(m[1]));
  });
  return "SRV-" + String(maior + 1).padStart(3, "0");
}

/* ------------------------------------------------------------
   5. FOTOS
   Sobem comprimidas para o depósito do Supabase. A exibição usa
   link assinado com validade de 8 horas, então a foto não fica
   exposta em endereço público.
   ------------------------------------------------------------ */
const LADO_MAX = 1400;
const QUALIDADE = 0.72;
const VALIDADE_LINK = 28800; /* 8 horas */

function comprimir(arquivo){
  return new Promise(function(ok){
    const leitor = new FileReader();
    leitor.onload = function(){
      const img = new Image();
      img.onload = function(){
        let l = img.width, a = img.height;
        if(l > LADO_MAX || a > LADO_MAX){
          const f = Math.min(LADO_MAX / l, LADO_MAX / a);
          l = Math.round(l * f); a = Math.round(a * f);
        }
        const cv = document.createElement("canvas");
        cv.width = l; cv.height = a;
        cv.getContext("2d").drawImage(img, 0, 0, l, a);
        cv.toBlob(function(blob){ ok(blob || arquivo); }, "image/jpeg", QUALIDADE);
      };
      img.onerror = function(){ ok(arquivo); };
      img.src = leitor.result;
    };
    leitor.onerror = function(){ ok(arquivo); };
    leitor.readAsDataURL(arquivo);
  });
}

async function guardarFoto(arquivo){
  const blob = await comprimir(arquivo);
  const registro = { id:id(), blob:blob, nome:arquivo.name || "foto.jpg", em:new Date().toISOString() };
  await salvar("fotos", registro);
  /* a prévia usa o arquivo que já está na memória: aparece na hora */
  estado.urls.set(registro.id, URL.createObjectURL(blob));
  return registro.id;
}

async function urlFoto(idFoto){
  if(estado.urls.has(idFoto)) return estado.urls.get(idFoto);
  const r = await sb.storage.from(BUCKET).createSignedUrl(idFoto + ".jpg", VALIDADE_LINK);
  if(!r.data || !r.data.signedUrl) return null;
  estado.urls.set(idFoto, r.data.signedUrl);
  return r.data.signedUrl;
}

/* pede os links de todas as fotos de uma vez, em lotes */
async function prepararFotos(){
  const faltando = idsFotosAtuais().filter(function(f){ return !estado.urls.has(f); });
  if(!faltando.length) return;
  for(let i = 0; i < faltando.length; i += 100){
    const lote = faltando.slice(i, i + 100);
    const r = await sb.storage.from(BUCKET)
      .createSignedUrls(lote.map(function(f){ return f + ".jpg"; }), VALIDADE_LINK);
    (r.data || []).forEach(function(item){
      if(item && item.signedUrl && item.path){
        estado.urls.set(String(item.path).replace(/\.jpg$/, ""), item.signedUrl);
      }
    });
  }
}

   6. FILTRO E ORDENAÇÃO
   ------------------------------------------------------------ */
function servicosFiltrados(){
  const f = estado.filtros;
  const termo = f.busca.trim().toLowerCase();

  let lista = estado.servicos.filter(function(s){
    if(f.status && s.status !== f.status) return false;
    if(f.resp && s.responsavel !== f.resp) return false;
    if(f.titulo && s.titulo !== f.titulo) return false;
    if(!termo) return true;
    const alvo = [
      s.titulo, s.codigo, s.local, s.disciplina, s.descricao, s.responsavel,
      (s.equipe || []).join(" "),
      (s.apontamentos || []).map(function(a){
        return (a.observacao || "") + " " + (a.colaboradores || []).join(" ");
      }).join(" ")
    ].join(" ").toLowerCase();
    return alvo.indexOf(termo) !== -1;
  });

  const ordem = f.ordem;
  lista.sort(function(a,b){
    if(ordem === "titulo")   return (a.titulo||"").localeCompare(b.titulo||"","pt-BR");
    if(ordem === "duracao")  return (duracao(b)||0) - (duracao(a)||0);
    if(ordem === "fim")      return (a.fimPrev||"9999").localeCompare(b.fimPrev||"9999");
    if(ordem === "atualizacao") return (ultimaAtualizacao(b)||"").localeCompare(ultimaAtualizacao(a)||"");
    return (a.inicio||"9999").localeCompare(b.inicio||"9999");
  });
  return lista;
}

  const t = estado.servicos;

  const fins = t.map(function(s){ return s.fimReal || s.fimPrev; }).filter(Boolean).sort();
  const periodo = inicios.length
    ? fmt(inicios[0]) + " a " + (fins.length ? fmt(fins[fins.length - 1]) : "em aberto")

    ? Math.round(t.reduce(function(n,s){ return n + (s.avanco || 0); }, 0) / t.length)
    : 0;

  alvo.innerHTML =
    dado(periodo, "Período dos serviços") +

    dado(avanco + "%", "Avanço médio") +

/* ------------------------------------------------------------
   7b. RESUMO QUANTITATIVO
   Agrupa por disciplina e unidade. Nunca soma unidades
   diferentes: m² e m³ ficam em linhas de total separadas.
   ------------------------------------------------------------ */
function pintarResumoQuant(){
  const alvo = $("#resumoQuant");
  const lista = servicosFiltrados().filter(function(s){ return quantPrevista(s) > 0; });

  if(!lista.length){
    alvo.innerHTML = "";
    return;
  }

  const grupos = new Map();
  lista.forEach(function(s){
    const disc = s.disciplina || "Sem disciplina";
    const un = s.unidade || "un";
    const chave = disc + "|" + un;
    if(!grupos.has(chave)) grupos.set(chave, {disc:disc, un:un, prev:0, exec:0, n:0});
    const g = grupos.get(chave);
    g.prev += quantPrevista(s);
    g.exec += quantExecutada(s);
    g.n += 1;
  });

  const linhas = Array.from(grupos.values()).sort(function(a,b){
    return a.disc.localeCompare(b.disc,"pt-BR") || a.un.localeCompare(b.un,"pt-BR");
  });

  const totais = new Map();
  linhas.forEach(function(g){
    if(!totais.has(g.un)) totais.set(g.un, {prev:0, exec:0});
    const t = totais.get(g.un);
    t.prev += g.prev; t.exec += g.exec;
  });

  function linhaPct(prev, exec){
    const pct = prev ? Math.min(100, Math.round((exec/prev)*100)) : 0;
    const classe = pct >= 100 ? "" : " parcial";
    return '<div style="display:flex;align-items:center;gap:8px;justify-content:flex-end">' +
             '<span class="barra-mini' + classe + '"><i style="width:' + pct + '%"></i></span>' +
             '<span style="font-family:var(--mono);min-width:38px;text-align:right">' + pct + '%</span>' +
           '</div>';
  }

  alvo.innerHTML =
  '<div class="painel-tabela">' +
    '<div class="painel-tabela__cab">' +
      '<span class="rotulo">Resumo quantitativo</span>' +
      '<span class="dica">previsto em cadastro, executado somado dos apontamentos</span>' +
    '</div>' +
    '<table class="tabela">' +
      '<thead><tr>' +
        '<th>Disciplina</th><th class="esconde-mob">Serviços</th><th>Unid.</th>' +
        '<th style="text-align:right">Previsto</th>' +
        '<th style="text-align:right">Executado</th>' +
        '<th style="text-align:right" class="esconde-mob">Saldo</th>' +
        '<th style="text-align:right">Avanço físico</th>' +
      '</tr></thead>' +
      '<tbody>' +
        linhas.map(function(g){
          return '<tr>' +
            '<td class="tit">' + esc(g.disc) + '</td>' +
            '<td class="num esconde-mob">' + g.n + '</td>' +
            '<td class="cod">' + esc(g.un) + '</td>' +
            '<td class="num">' + num(g.prev) + '</td>' +
            '<td class="num">' + num(g.exec) + '</td>' +
            '<td class="num esconde-mob">' + num(g.prev - g.exec) + '</td>' +
            '<td>' + linhaPct(g.prev, g.exec) + '</td>' +
          '</tr>';
        }).join("") +
      '</tbody>' +
      '<tfoot>' +
        Array.from(totais.entries()).map(function(par){
          const un = par[0], t = par[1];
          return '<tr>' +
            '<td colspan="2">Total em ' + esc(un) + '</td>' +
            '<td></td>' +
            '<td class="num">' + num(t.prev) + '</td>' +
            '<td class="num">' + num(t.exec) + '</td>' +

  const st = STATUS[s.status] || STATUS.planejado;
  const equipe = pessoasDo(s);

  let tira;
  if(fotos.length){
    const mostrar = fotos.slice(-3);

      return '<img src="' + srcFoto(f) + '" alt="Foto do serviço" data-foto="' + f + '" data-srv="' + s.id + '">';
    }).join("");
    if(fotos.length > 3) tira += '<div class="tira__mais">+' + (fotos.length - 3) + '</div>';
  } else {
    tira = '<div class="tira__vazia">sem fotos</div>';
  }

  let classeContador = "";
  if(s.status === "concluido") classeContador = " contador--fechado";
  else if(atraso > 0) classeContador = " contador--atrasado";

  const equipeHTML = equipe.length
    ? equipe.slice(0,3).map(function(p){ return '<span class="pessoa">' + esc(p) + '</span>'; }).join("") +

  const fimPendente = !(s.status === "concluido" && s.fimReal) ;

  return '' +
  '<article class="cartao" data-id="' + s.id + '">' +
    '<div class="cartao__topo">' +

      '<div class="cartao__tit">' +
        '<span class="cartao__cod">' + esc(s.codigo) + (s.disciplina ? " · " + esc(s.disciplina) : "") + '</span>' +
        '<h3>' + esc(s.titulo) + '</h3>' +

      '</div>' +
      '<span class="marca marca--' + s.status + '">' + st.rot + '</span>' +
    '</div>' +

    '<div class="tira">' + tira + '</div>' +
    '<div class="prog"><div class="prog__b" style="width:' + (s.avanco || 0) + '%"></div></div>' +

    '<div class="dados">' +
      '<div class="dados__c">' +
        '<span class="dados__r">Início</span>' +
        '<span class="dados__v">' + fmt(s.inicio) + '</span>' +
      '</div>' +
      '<div class="dados__c">' +
        '<span class="dados__r">' + (s.status === "concluido" ? "Término" : "Previsto") + '</span>' +
        '<span class="dados__v' + (fimPendente ? " pendente" : "") + '">' + fmt(fimMostrado) + '</span>' +
      '</div>' +
      '<div class="contador' + classeContador + '">' +
        '<span class="contador__n">' + (dur === null ? "—" : dur) + '</span>' +
        '<span class="contador__u">' + (s.status === "concluido" ? "dias" : "dias") + '</span>' +
      '</div>' +
    '</div>' +

    (quantPrevista(s)
      ? '<div class="quant-cartao">' +
          '<span>' + num(quantExecutada(s)) + ' / ' + num(quantPrevista(s)) + ' ' + esc(s.unidade || "") + '</span>' +
          '<span class="pct">' + (avancoFisico(s) === null ? "" : avancoFisico(s) + "% físico") + '</span>' +
        '</div>'
      : '') +

    (atraso > 0

/* ------------------------------------------------------------
   9. PAINEL — linha do tempo
   ------------------------------------------------------------ */
function pintarLinhaTempo(){
  const lista = servicosFiltrados().filter(function(s){ return s.inicio; });
  const alvo = $("#linhaTempo");

  if(!lista.length){
    alvo.innerHTML = '<div class="vazio"><h3>Sem serviços com data de início</h3>' +
      '<p>A linha do tempo usa a data de início e a data de término prevista.</p></div>';
    return;
  }

  let min = null, max = null;
  lista.forEach(function(s){
    const i = dataLocal(s.inicio);
    const f = dataLocal(s.fimReal || s.fimPrev) || dataLocal(hojeISO());
    if(!min || i < min) min = i;
    if(!max || f > max) max = f;
  });
  const h = dataLocal(hojeISO());
  if(h < min) min = h;
  if(h > max) max = h;

  min = new Date(min.getTime()); min.setDate(min.getDate() - 2);
  max = new Date(max.getTime()); max.setDate(max.getDate() + 2);

  const total = Math.max(1, Math.round((max - min) / 86400000));
  const larguraDia = total > 120 ? 5 : total > 60 ? 9 : total > 30 ? 17 : 30;
  const largura = total * larguraDia;

  function pos(d){ return Math.round((dataLocal(d) - min) / 86400000) * larguraDia; }

  /* réguas de mês */
  let regua = "";
  const c = new Date(min.getFullYear(), min.getMonth(), 1);
  while(c <= max){
    if(c >= min){
      const x = Math.round((c - min) / 86400000) * larguraDia;
      const nome = c.toLocaleDateString("pt-BR", {month:"short", year:"2-digit"}).replace(".", "");
      regua += '<span class="marca-mes" style="left:' + x + 'px">' + nome + '</span>';
    }
    c.setMonth(c.getMonth() + 1);
  }

  const xHoje = pos(hojeISO());

  const linhas = lista.map(function(s){
    const st = STATUS[s.status] || STATUS.planejado;
    const fim = s.fimReal || s.fimPrev || hojeISO();
    const x1 = pos(s.inicio);
    const x2 = pos(fim) + larguraDia;
    const w = Math.max(larguraDia, x2 - x1);
    const dur = duracao(s);
    const atraso = diasAtraso(s);

    return '<tr data-id="' + s.id + '">' +
      '<td class="col-nome">' +
        '<strong>' + esc(s.titulo) + '</strong>' +
        '<span>' + esc(s.codigo) + " · " + st.rot + (dur !== null ? " · " + dur + " dias" : "") + '</span>' +
      '</td>' +
      '<td>' +
        '<div class="faixa-tempo" style="--passo:' + larguraDia + 'px;width:' + largura + 'px">' +
          '<div class="barra-g barra-g--' + s.status + '" style="left:' + x1 + 'px;width:' + w + 'px" ' +
            'title="' + esc(s.titulo) + ' · ' + fmtLongo(s.inicio) + ' a ' + fmtLongo(fim) + '">' +
            (w > 70 ? fmt(s.inicio) + " – " + fmt(fim) + (atraso ? "  (+" + atraso + "d)" : "") : "") +
          '</div>' +
          '<div class="hoje" style="left:' + xHoje + 'px"></div>' +
        '</div>' +
      '</td>' +
    '</tr>';
  }).join("");

  alvo.innerHTML =
    '<table>' +
      '<thead><tr>' +
        '<th class="col-nome">Serviço</th>' +
        '<th><div class="gantt__cab-tempo" style="width:' + largura + 'px">' + regua + '</div></th>' +
      '</tr></thead>' +
      '<tbody>' + linhas + '</tbody>' +
    '</table>';
}

function tarefasPlanejadas(){
  const termo = ($("#buscaPlano") ? $("#buscaPlano").value : "").trim().toLowerCase();
  const disc = $("#filtroDiscPlano") ? $("#filtroDiscPlano").value : "";
  return estado.servicos
    .filter(function(s){ return s.status === "planejado"; })
    .filter(function(s){ return !disc || s.disciplina === disc; })
    .filter(function(s){
      if(!termo) return true;
      return [s.titulo,s.codigo,s.local,s.disciplina,s.responsavel,s.descricao]
        .join(" ").toLowerCase().indexOf(termo) !== -1;
    })
    .sort(function(a,b){ return (a.inicio||"9999").localeCompare(b.inicio||"9999"); });
}

/* tarefa planejada cuja data de início já passou */

  return s.status === "planejado" && s.inicio && difDias(s.inicio, hojeISO()) > 0;

function comecaEmAte(s, dias){
  if(!s.inicio) return false;
  const d = difDias(hojeISO(), s.inicio);
  return d !== null && d >= 0 && d <= dias;
}

async function iniciarTarefa(idServico){
  const s = estado.servicos.find(function(x){ return x.id === idServico; });
  if(!s) return;
  const hoje = hojeISO();
  let inicio = s.inicio;
  if(inicio !== hoje && confirm('Iniciar "' + s.titulo + '" hoje?\n\nOK ajusta a data de início para ' + fmtLongo(hoje) +
     '.\nCancelar mantém ' + fmtLongo(s.inicio) + ' e apenas muda o status.')){
    inicio = hoje;
  }
  const antes = {status:s.status, inicio:s.inicio};
  s.status = "andamento";
  s.inicio = inicio;
  try{ await salvar("servicos", s); }
  catch(e){ s.status = antes.status; s.inicio = antes.inicio; aviso(explicarErro(e)); return; }
  pintarTudo();
  aviso(s.codigo + " passou para Em andamento");
}

    return (a.inicio||"9999").localeCompare(b.inicio||"9999");

function celula(rot, val){
  return '<div class="dados__c"><span class="dados__r">' + rot + '</span>' +
         '<span class="dados__v">' + esc(val) + '</span></div>';
}

function historico(s){
  const aps = (s.apontamentos || []).slice().sort(function(a,b){
    return (b.data || "").localeCompare(a.data || "");
  });
  if(!aps.length){
    return '<p style="color:var(--tinta-2);font-size:13.5px;margin:0">' +
      'Nenhum apontamento registrado. O primeiro lançamento aparece aqui.</p>';
  }
  return '<ol class="historico">' + aps.map(function(a){
    const fotos = (a.fotos || []).map(function(f){
      return '<div class="mini"><img src="' + srcFoto(f) + '" alt="Registro fotográfico" data-foto="' + f + '" data-srv="' + s.id + '" style="cursor:zoom-in"></div>';
    }).join("");
    const colabs = (a.colaboradores || []).map(function(p){
      return '<span class="pessoa">' + esc(p) + '</span>';
    }).join("");
    return '<li class="apont">' +
      '<div class="apont__cab">' +
        '<span class="apont__data">' + fmtLongo(a.data) + '</span>' +
        (a.avanco != null ? '<span class="etiqueta etiqueta--avanco">' + a.avanco + '%</span>' : '') +
        (a.quantidade ? '<span class="etiqueta etiqueta--avanco">' + num(a.quantidade) + ' ' + esc(s.unidade || "") + '</span>' : '') +
        (a.efetivo ? '<span class="etiqueta">efetivo ' + a.efetivo + '</span>' : '') +
        '<button class="btn btn--p btn--fantasma" data-acao="apagar-apont" data-srv="' + s.id + '" data-ap="' + a.id + '" style="margin-left:auto">Excluir</button>' +
      '</div>' +
      (colabs ? '<div class="equipe" style="margin:3px 0">' + colabs + '</div>' : '') +
      (a.observacao ? '<div class="apont__obs">' + esc(a.observacao) + '</div>' : '') +
      (fotos ? '<div class="miniaturas">' + fotos + '</div>' : '') +
    '</li>';
  }).join("") + '</ol>';
}

/* ------------------------------------------------------------
   12. RASCUNHO DO APONTAMENTO (chips + fotos)
   ------------------------------------------------------------ */
const rascunho = { colaboradores: [], fotos: [] };

function montarChips(){
  rascunho.colaboradores = [];
  pintarChips();
  pintarSugestoes();
}

function pintarChips(){
  const caixa = $("#chipsColab");
  if(!caixa) return;
  const entrada = $("#entradaColab");
  $$(".chip", caixa).forEach(function(c){ c.remove(); });
  rascunho.colaboradores.forEach(function(nome, i){
    const el = document.createElement("span");
    el.className = "chip";
    el.innerHTML = esc(nome) + '<button type="button" data-remove-chip="' + i + '" aria-label="Remover ' + esc(nome) + '">&times;</button>';
    caixa.insertBefore(el, entrada);
  });
}

function pintarSugestoes(){
  const alvo = $("#sugestoesColab");
  if(!alvo) return;
  const todos = new Set();
  estado.servicos.forEach(function(s){
    pessoasDo(s).forEach(function(p){ todos.add(p); });
  });
  const nomes = Array.from(todos)
    .filter(function(n){ return rascunho.colaboradores.indexOf(n) === -1; })
    .sort(function(a,b){ return a.localeCompare(b,"pt-BR"); })
    .slice(0, 14);
  alvo.innerHTML = nomes.length
    ? '<span class="dica" style="align-self:center;margin-right:2px">já cadastrados:</span>' +
      nomes.map(function(n){ return '<button type="button" class="sugestao" data-sug="' + esc(n) + '">' + esc(n) + '</button>'; }).join("")
    : "";
}

function addColaborador(nome){
  const n = String(nome || "").trim().replace(/\s+/g," ");
  if(!n) return;
  if(rascunho.colaboradores.indexOf(n) === -1) rascunho.colaboradores.push(n);
  pintarChips();
  pintarSugestoes();
}

function pintarMiniaturas(){
  const alvo = $("#miniaturas");
  if(!alvo) return;
  alvo.innerHTML = rascunho.fotos.map(function(f, i){
    return '<div class="mini"><img src="' + srcFoto(f) + '" alt="Foto selecionada">' +
      '<button type="button" data-remove-foto="' + i + '" aria-label="Remover foto">&times;</button></div>';
  }).join("");
}

async function receberArquivos(arquivos){
  const imagens = Array.prototype.slice.call(arquivos).filter(function(a){
    return a.type && a.type.indexOf("image/") === 0;
  });
  if(!imagens.length) return;
  aviso("Processando " + imagens.length + " foto(s)...");
  for(const arq of imagens){
    try { rascunho.fotos.push(await guardarFoto(arq)); }
    catch(e){ aviso("Não foi possível gravar uma das fotos."); }
  }
  pintarMiniaturas();
  aviso(imagens.length + " foto(s) prontas para o apontamento");
}

/* ------------------------------------------------------------
   13. SALVAR APONTAMENTO
   ------------------------------------------------------------ */
async function salvarApontamento(){
  const s = estado.servicos.find(function(x){ return x.id === estado.selecionado; });
  if(!s) return;

  const data = $("#apData").value || hojeISO();
  const obs = $("#apObs").value.trim();
  const avancoBruto = $("#apAvanco").value;
  const efetivo = $("#apEfetivo").value;
  const quantExec = $("#apQuant") ? $("#apQuant").value : "";
  const pendente = $("#entradaColab").value.trim();
  if(pendente) addColaborador(pendente);

  if(!obs && !rascunho.fotos.length && !rascunho.colaboradores.length && quantExec === ""){
    aviso("Registre ao menos uma observação, foto ou colaborador.");
    return;
  }

  const ap = {
    id: id(),
    data: data,
    observacao: obs,
    colaboradores: rascunho.colaboradores.slice(),
    fotos: rascunho.fotos.slice(),
    avanco: avancoBruto === "" ? null : Math.max(0, Math.min(100, Number(avancoBruto))),
    efetivo: efetivo === "" ? null : Number(efetivo),
    quantidade: quantExec === "" ? null : Number(quantExec),
    criadoEm: new Date().toISOString()
  };

  const antes = { avanco:s.avanco, status:s.status, fimReal:s.fimReal };
  s.apontamentos = s.apontamentos || [];
  s.apontamentos.push(ap);

  if(ap.avanco != null){
    s.avanco = ap.avanco;
    /* o avanço governa o status: 100% fecha o serviço na data do apontamento */
    if(ap.avanco >= 100 && s.status !== "concluido"){
      s.status = "concluido";
      if(!s.fimReal) s.fimReal = data;
    } else if(ap.avanco > 0 && ap.avanco < 100 && s.status === "planejado"){
      s.status = "andamento";
    }
  }
  if(s.status === "planejado" && !s.fimReal) s.status = "andamento";

  const btn = $("#btnSalvarApont");
  if(btn){ btn.disabled = true; btn.textContent = "Salvando..."; }
  try{
    await salvar("servicos", s);
  } catch(e){
    /* devolve o apontamento para o rascunho: nada do que foi digitado se perde */
    s.apontamentos = s.apontamentos.filter(function(a){ return a.id !== ap.id; });
    s.avanco = antes.avanco; s.status = antes.status; s.fimReal = antes.fimReal;
    if(btn){ btn.disabled = false; btn.textContent = "Salvar apontamento"; }
    aviso(explicarErro(e));
    return;
  }
  rascunho.fotos = [];
  rascunho.colaboradores = [];
  pintarTudo();
  aviso("Apontamento salvo em " + fmtLongo(data));
}

async function gravarServico(idServico){
  const titulo = $("#fTitulo").value.trim();
  const inicio = $("#fInicio").value;
  if(!titulo){ aviso("Informe o título do serviço."); $("#fTitulo").focus(); return; }
  if(!inicio){ aviso("Informe a data de início."); $("#fInicio").focus(); return; }

  const fimPrev = $("#fFimPrev").value;
  const fimReal = $("#fFimReal").value;
  if(fimPrev && difDias(inicio, fimPrev) < 0){ aviso("O término previsto é anterior ao início."); return; }
  if(fimReal && difDias(inicio, fimReal) < 0){ aviso("O término real é anterior ao início."); return; }

  const existente = idServico ? estado.servicos.find(function(x){ return x.id === idServico; }) : null;
  const s = existente || { id:id(), apontamentos:[], fotos:[], criadoEm:new Date().toISOString() };

  const codigoDigitado = $("#fCodigo").value.trim();
  const codigoFinal = codigoDigitado || proximoCodigo();
  const emUsoPor = estado.servicos.find(function(x){
    return x.codigo === codigoFinal && x.id !== (existente ? existente.id : null);
  });
  if(emUsoPor){
    aviso('O código "' + codigoFinal + '" já está em uso em "' + emUsoPor.titulo + '". Sugestão: ' + proximoCodigo());
    $("#fCodigo").focus();
    return;
  }
  s.codigo = codigoFinal;
  s.titulo = titulo;
  s.local = $("#fLocal").value.trim();
  s.disciplina = $("#fDisciplina").value.trim();
  s.inicio = inicio;
  s.fimPrev = fimPrev;
  s.fimReal = fimReal;
  s.status = $("#fStatus").value;
  s.avanco = Math.max(0, Math.min(100, Number($("#fAvanco").value) || 0));
  s.quantidade = Number($("#fQuant").value) || 0;
  s.unidade = $("#fUnidade").value.trim();
  s.responsavel = $("#fResp").value.trim();
  s.equipe = $("#fEquipe").value.split(",").map(function(p){ return p.trim(); }).filter(Boolean);
  s.descricao = $("#fDescricao").value.trim();

  if(s.status === "concluido" && !s.fimReal) s.fimReal = s.fimPrev || hojeISO();
  if(s.status !== "concluido") s.fimReal = fimReal;

  try{
    await salvar("servicos", s);
  } catch(e){ aviso(explicarErro(e)); return; }
  if(!existente) estado.servicos.push(s);
  fecharModal();
  pintarTudo();
  aviso(existente ? "Serviço atualizado" : "Serviço " + s.codigo + " cadastrado");
}

async function excluirServico(idServico){
  const s = estado.servicos.find(function(x){ return x.id === idServico; });
  if(!s) return;
  if(!confirm('Excluir "' + s.titulo + '" e todos os seus apontamentos e fotos? Esta ação não pode ser desfeita.')) return;
  for(const f of fotosDo(s)){
    await apagar("fotos", f);
    if(estado.urls.has(f)){ URL.revokeObjectURL(estado.urls.get(f)); estado.urls.delete(f); }
  }
  await apagar("servicos", idServico);
  estado.servicos = estado.servicos.filter(function(x){ return x.id !== idServico; });
  if(estado.selecionado === idServico) estado.selecionado = null;
  fecharModal();
  pintarTudo();
  aviso("Serviço excluído");
}

/* ------------------------------------------------------------
   16. DADOS: exportar, backup, restaurar
   ------------------------------------------------------------ */
function baixar(nome, conteudo, tipo){
  const blob = conteudo instanceof Blob ? conteudo : new Blob([conteudo], {type:tipo});
  const u = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = u; a.download = nome; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(u); a.remove(); }, 500);
}

function csv(linhas){
  /* ; como separador e BOM: o Excel em pt-BR abre direto, sem assistente */
  const txt = linhas.map(function(l){
    return l.map(function(c){
      const v = c == null ? "" : String(c);
      return /[";\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
    }).join(";");
  }).join("\r\n");
  return new Blob(["\uFEFF" + txt], {type:"text/csv;charset=utf-8"});
}

function exportarServicos(){
  const linhas = [[
    "Código","Título","Disciplina","Local","Status","Início","Término previsto","Término real",
    "Dias corridos","Dias úteis","Atraso (dias)","Avanço (%)","Unidade","Quant. prevista","Quant. executada",
    "Saldo","Avanço físico (%)","Responsável","Equipe","Apontamentos","Fotos","Escopo"
  ]];
  servicosFiltrados().forEach(function(s){
    linhas.push([
      s.codigo, s.titulo, s.disciplina, s.local, (STATUS[s.status]||{}).rot,
      fmtLongo(s.inicio), fmtLongo(s.fimPrev), s.fimReal ? fmtLongo(s.fimReal) : "",
      duracao(s), s.inicio ? diasUteis(s.inicio, dataReferencia(s)) : "",
      diasAtraso(s), s.avanco || 0, s.unidade || "", quantPrevista(s) || "", quantExecutada(s) || "",
      quantPrevista(s) ? quantPrevista(s) - quantExecutada(s) : "", avancoFisico(s) === null ? "" : avancoFisico(s),
      s.responsavel, (s.equipe||[]).join(", "),
      (s.apontamentos||[]).length, fotosDo(s).length, s.descricao
    ]);
  });
  baixar("servicos-obra-" + hojeISO() + ".csv", csv(linhas));
}

function exportarApontamentos(){
  const linhas = [["Código","Serviço","Data","Avanço (%)","Quant. executada","Unidade","Efetivo","Colaboradores","Fotos","Observação"]];
  servicosFiltrados().forEach(function(s){
    (s.apontamentos||[]).slice().sort(function(a,b){ return (a.data||"").localeCompare(b.data||""); })
      .forEach(function(a){
        linhas.push([
          s.codigo, s.titulo, fmtLongo(a.data), a.avanco == null ? "" : a.avanco,
          a.quantidade || "", s.unidade || "",
          a.efetivo || "", (a.colaboradores||[]).join(", "), (a.fotos||[]).length, a.observacao
        ]);
      });
  });
  baixar("apontamentos-obra-" + hojeISO() + ".csv", csv(linhas));
}

function blobParaBase64(blob){
  return new Promise(function(ok){
    const r = new FileReader();
    r.onload = function(){ ok(String(r.result).split(",")[1]); };
    r.readAsDataURL(blob);
  });
}
function base64ParaBlob(b64, tipo){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type: tipo || "image/jpeg"});
}

async function fazerBackup(){
  aviso("Gerando backup, aguarde...");
  const fotos = await lerTudo("fotos");
  const pacote = { versao:1, em:new Date().toISOString(), obra:estado.nomeObra, servicos:estado.servicos, fotos:[] };
  for(const f of fotos){
    pacote.fotos.push({ id:f.id, nome:f.nome, tipo:f.blob.type, dados: await blobParaBase64(f.blob) });
  }
  baixar("backup-obra-" + hojeISO() + ".json", JSON.stringify(pacote), "application/json");
  aviso("Backup gerado com " + pacote.fotos.length + " foto(s)");
}

async function restaurar(arquivo){
  try{
    const pacote = JSON.parse(await arquivo.text());
    if(!pacote.servicos) throw new Error("formato");
    if(!confirm("Restaurar " + pacote.servicos.length + " serviço(s) do backup? Isso substitui o que está hoje na nuvem, para todos os aparelhos.")) return;

    const antigas = idsFotosAtuais();
    for(const s of estado.servicos) await apagar("servicos", s.id);
    for(const f of antigas) await apagar("fotos", f);
    estado.urls.forEach(function(u){ URL.revokeObjectURL(u); });
    estado.urls.clear();

    for(const f of (pacote.fotos || [])){
      await salvar("fotos", { id:f.id, blob:base64ParaBlob(f.dados, f.tipo), nome:f.nome, em:pacote.em });
    }
    for(const s of pacote.servicos) await salvar("servicos", s);
    estado.servicos = pacote.servicos;
    estado.nomeObra = pacote.obra || "";
    $("#nomeObra").value = estado.nomeObra;
    await prepararFotos();
    fecharModal();
    pintarTudo();
    aviso("Backup restaurado");
  } catch(e){
    aviso("Arquivo inválido. Use um backup gerado por esta ferramenta.");
  }
}

document.addEventListener("click", function(ev){
  const alvo = ev.target;
  const btn = alvo.closest ? alvo.closest("[data-acao],[data-sel],[data-fechar],[data-foto],[data-nav],[data-sug],[data-remove-chip],[data-remove-foto]") : null;

  /* fechar modal ao clicar na cortina */
  if(alvo.id === "cortina" || alvo.id === "lightbox"){ fecharModal(); return; }
  if(!btn) return;

  if(btn.hasAttribute("data-fechar")){ fecharModal(); return; }

  if(btn.hasAttribute("data-sel")){
    estado.selecionado = btn.getAttribute("data-sel");
    pintarListaServicos(); pintarDetalhe();
    return;
  }

  if(btn.hasAttribute("data-foto")){
    abrirFoto(btn.getAttribute("data-foto"), btn.getAttribute("data-srv"));
    return;
  }

  if(btn.hasAttribute("data-nav")){
    const p = Number(btn.getAttribute("data-nav"));
    galeria.i = (galeria.i + p + galeria.fotos.length) % galeria.fotos.length;
    pintarLightbox();
    return;
  }

  if(btn.hasAttribute("data-sug")){ addColaborador(btn.getAttribute("data-sug")); return; }

  if(btn.hasAttribute("data-remove-chip")){
    rascunho.colaboradores.splice(Number(btn.getAttribute("data-remove-chip")), 1);
    pintarChips(); pintarSugestoes();
    return;
  }

  if(btn.hasAttribute("data-remove-foto")){
    const i = Number(btn.getAttribute("data-remove-foto"));
    const f = rascunho.fotos[i];
    rascunho.fotos.splice(i, 1);
    apagar("fotos", f);
    pintarMiniaturas();
    return;
  }

  const acao = btn.getAttribute("data-acao");
  const idAlvo = btn.getAttribute("data-id");

  if(acao === "novo")    abrirFormServico(null);
  if(acao === "nova-tarefa"){ trocarAba("planejamento"); abrirFormServico(null, true); }
  if(acao === "iniciar")  iniciarTarefa(idAlvo);
  if(acao === "editar")  abrirFormServico(idAlvo);
  if(acao === "excluir-servico") excluirServico(idAlvo);
  if(acao === "acompanhar"){
    estado.selecionado = idAlvo;
    estado.filtros.lista = "todos";
    $("#filtroLista").value = "todos";
    trocarAba("acompanhamento");
  }
  if(acao === "limpar"){
    estado.filtros.busca = ""; estado.filtros.status = ""; estado.filtros.resp = ""; estado.filtros.titulo = "";
    $("#busca").value = ""; $("#filtroStatus").value = ""; $("#filtroResp").value = ""; $("#filtroTitulo").value = "";
    pintarPainel();
  }
  if(acao === "exemplo") carregarExemplo();
  if(acao === "csv-servicos")     exportarServicos();
  if(acao === "csv-apontamentos") exportarApontamentos();
  if(acao === "backup")           fazerBackup();
  if(acao === "restaurar")        $("#arquivoBackup").click();
  if(acao === "apagar-apont")     apagarApontamento(btn.getAttribute("data-srv"), btn.getAttribute("data-ap"));
});

async function apagarApontamento(idServico, idAp){
  const s = estado.servicos.find(function(x){ return x.id === idServico; });
  if(!s) return;
  const ap = (s.apontamentos || []).find(function(a){ return a.id === idAp; });
  if(!ap) return;
  if(!confirm("Excluir o apontamento de " + fmtLongo(ap.data) + " e suas fotos?")) return;
  for(const f of (ap.fotos || [])){
    await apagar("fotos", f);
    if(estado.urls.has(f)){ URL.revokeObjectURL(estado.urls.get(f)); estado.urls.delete(f); }
  }
  s.apontamentos = s.apontamentos.filter(function(a){ return a.id !== idAp; });
  await salvar("servicos", s);
  pintarTudo();
  aviso("Apontamento excluído");
}
